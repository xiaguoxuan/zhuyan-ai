name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Typecheck and build
    runs-on: windows-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: zhuyan-ai-desktop

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: zhuyan-ai-desktop/package-lock.json

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit all dependencies
        run: npm audit --audit-level=high

      - name: Typecheck and build
        run: npm run build

      - name: Verify restricted packaging runtime
        run: npm run prepare:packaging
