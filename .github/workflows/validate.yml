name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Typecheck and build
    runs-on: windows-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: zhuyan-ai-desktop

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: zhuyan-ai-desktop/package-lock.json

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit all dependencies
        run: npm audit --audit-level=high

      - name: Typecheck and build
        run: npm run build

      - name: Verify restricted packaging runtime
        run: npm run prepare:packaging
